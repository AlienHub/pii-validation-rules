name: pages

# Deploy only when the owner has enabled GitHub Pages (Settings → Pages →
# GitHub Actions) and then runs this workflow manually — or after merge to main.
# Auto-deploy on every feature-branch push was removed: it 404s until Pages is
# enabled and paints a failing "deploy" check on the PR.
on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build PII Atlas static site
        run: |
          python3 tools/build_website.py
          python3 tools/check_website.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website-dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
